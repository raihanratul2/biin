{% extends 'base.html' %}

{% block title %}404 — Page not found | BIIN{% endblock %}
{% block extra_head %}<meta name="robots" content="noindex, nofollow">{% endblock %}

{% block content %}
<section class="not-found-page" aria-labelledby="not-found-title">
    <div class="container narrow center-copy">
        <p class="not-found-code" aria-hidden="true">404</p>
        <h1 id="not-found-title">Page not found</h1>
        <p class="not-found-description">The page you're looking for may have moved or no longer exists. Let's get you back on track.</p>
        <div class="not-found-actions">
            <a href="{% url 'home' %}" class="button primary">Back to Home</a>
            <a href="{% url 'contact' %}" class="button secondary">Contact BIIN</a>
        </div>
    </div>
</section>
{% endblock %}
