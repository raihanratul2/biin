<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="form-card">
        <h1>BIIN Campus Ambassador Registration Form</h1>
        <p>Please fill out the form below to register.</p>
        <form method="post">
            <h3>Personal Information</h3>

            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="phone">Phone Number (Whatsapp)</label><br>
            <input type="number" id="phone" name="phone"><br><br>

            <label for="Current address">Current address</label><br>
            <input type="text" id="Current address" name="Current address"><br><br>

            <label for="pf">Photo:</label><br>
            <input type="file" id="pf" name="pf" required><br><br>

            <h3>Institution Information</h3>       

            <label for="university">University Name</label><br>
            <input type="text" id="university" name="university" required><br><br>

            <label for="department">Department / Subject</label><br>
            <input type="text" id="department" name="department" required><br><br>

            <label for="student_id">Student ID</label><br>
            <input type="text" id="student_id" name="student_id" required><br><br>

            <label for="semister">Current year / Semister</label><br>
            <input type="text" id="semister" name="semister" required><br><br>

            <h3>Social Information</h3>

            <label for="fb_link">Facebook Profile Link</label><br>
            <input type="text" id="fb_link" name="fb_link" required><br><br>

            <label for="linkdin_link">Linkdin</label><br>
            <input type="text" id="linkdin_link" name="linkdin_link" required><br><br>

            <label for="website">Website</label><br>
            <input type="text" id="website" name="website" required><br><br>

            
            <button type="submit" class="btn" value="Register">Submit</button>
        </form>
    </div>
</body>
</html>
