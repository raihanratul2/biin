{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BIIN{% endblock %}</title>
    <meta name="description" content="BIIN campus ambassador portal and registration platform">
    <link rel="icon" type="image/png" href="{% static 'BIIN_Logo.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'main.css?version=2' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="site-layout {% block body_class %}{% endblock %}">
    {% block header %}
    <header class="site-header">
        <div class="navbar container" aria-label="BIIN header">
            <div class="brand-wrap">
                <span class="brand-logo">
                    <img src="{% static 'BIIN_Logo.png' %}" alt="BIIN — Bangladesh ICT and Innovation Network">
                </span>
            </div>
        </div>
    </header>
    {% endblock %}

    <main class="site-main">
        {% block content %}{% endblock %}
    </main>

    {% block footer %}{% endblock %}
</body>
</html>
